<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Login Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="glass-effect">
            <h2>Login</h2>
            <form id="loginForm">
                <label class="visually-hidden" for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required>
                <label class="visually-hidden" for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
                <button class="password-toggle" type="button" id="togglePassword" aria-controls="password" aria-pressed="false">Show password</button>
                <button type="submit" id="loginButton">Login</button>
            </form>
            <p id="error-message" style="display: none;" role="alert">Please fill in both fields!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
